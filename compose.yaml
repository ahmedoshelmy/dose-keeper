name: dose-keeper

# Everything runs locally for free: Azurite emulates Blob/Queue/Table storage (the Durable Functions task hub
# lives there too), the official Functions host image runs the .NET isolated worker, nginx serves the web page.
x-storage: &storage "UseDevelopmentStorage=true;DevelopmentStorageProxyUri=http://azurite"

services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.38.0
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck --loose --inMemoryPersistence
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "10002"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 256m

  functions:
    build:
      context: .
      dockerfile: src/DoseKeeper.Functions/Dockerfile
    environment:
      AzureWebJobsStorage: *storage
      # The Durable client binding builds management URLs from this; Azure sets it, local hosts must.
      WEBSITE_HOSTNAME: localhost:80
      RefillCheckSchedule: ${REFILL_CHECK_SCHEDULE:-0 0 2 * * *}
      WeeklyReportSchedule: ${WEEKLY_REPORT_SCHEDULE:-0 0 6 * * Sat}
    ports:
      - "7071:80"
    depends_on:
      azurite:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/api/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512m
